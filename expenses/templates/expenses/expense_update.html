
{% extends 'base.html' %}

{% block content %}
<div class="container py-4">

    <div class="mb-4">
        <h2 class="fw-bold">Update Expense</h2>
        <p class="text-muted">Modify existing expense information.</p>
    </div>

    <div class="card shadow-sm border-0">
        <div class="card-body p-4">

            <form method="POST" enctype="multipart/form-data">
                {% csrf_token %}

                <div class="row g-3">

                    <div class="col-md-6">
                        <label class="form-label">Expense Title</label>
                        <input type="text"
                               name="title"
                               class="form-control"
                               value="{{ expense.title }}"
                               required>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">Category</label>
                        <select name="category" class="form-select" required>
                            {% for value, label in expense.CATEGORY_CHOICES %}
                            <option value="{{ value }}"
                                {% if expense.category == value %}selected{% endif %}>
                                {{ label }}
                            </option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">Vehicle</label>
                        <select name="vehicle" class="form-select">
                            <option value="">No Vehicle / General Expense</option>

                            {% for vehicle in vehicles %}
                            <option value="{{ vehicle.pk }}"
                                {% if expense.vehicle_id == vehicle.pk %}selected{% endif %}>
                                {{ vehicle.vehicle_number }} - {{ vehicle.vehicle_name }}
                            </option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">Amount (₹)</label>
                        <input type="number"
                               name="amount"
                               class="form-control"
                               step="0.01"
                               min="0.01"
                               value="{{ expense.amount }}"
                               required>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">Expense Date</label>
                        <input type="date"
                               name="expense_date"
                               class="form-control"
                               value="{{ expense.expense_date|date:'Y-m-d' }}"
                               required>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">Replace Receipt</label>
                        <input type="file"
                               name="receipt"
                               class="form-control">

                        {% if expense.receipt %}
                        <small class="text-muted">
                            Current receipt: {{ expense.receipt.name }}
                        </small>
                        {% endif %}
                    </div>

                    <div class="col-12">
                        <label class="form-label">Description</label>
                        <textarea name="description"
                                  class="form-control"
                                  rows="4">{{ expense.description }}</textarea>
                    </div>

                </div>

                <hr>

                <button type="submit" class="btn btn-primary">
                    Update Expense
                </button>

                <a href="{% url 'expense_list' %}" class="btn btn-secondary">
                    Cancel
                </a>

            </form>

        </div>
    </div>

</div>
{% endblock %}


{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}Fleet Management System{% endblock %}</title>

    <style>
        :root {
            --primary: #2563eb;
            --primary-dark: #1d4ed8;
            --navy: #101d36;
            --navy-light: #1b2b49;
            --background: #f4f7fc;
            --white: #ffffff;
            --text: #1e293b;
            --muted: #64748b;
            --border: #e8edf5;
            --success: #16a34a;
            --warning: #d97706;
            --danger: #dc2626;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: var(--background);
            color: var(--text);
            min-height: 100vh;
        }

        a {
            text-decoration: none;
        }

        button {
            font-family: inherit;
        }

        .app-layout {
            display: flex;
            min-height: 100vh;
        }

        /* SIDEBAR */

        .sidebar {
            width: 255px;
            background: var(--navy);
            color: white;
            position: fixed;
            top: 0;
            bottom: 0;
            left: 0;
            overflow-y: auto;
            z-index: 1000;
            transition: transform 0.3s ease;
        }

        .sidebar-brand {
            height: 75px;
            display: flex;
            align-items: center;
            padding: 0 25px;
            gap: 12px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        .brand-icon {
            width: 38px;
            height: 38px;
            background: var(--primary);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }

        .brand-name {
            font-size: 17px;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .brand-subtitle {
            color: #9caec9;
            font-size: 10px;
            margin-top: 4px;
        }

        .sidebar-content {
            padding: 25px 14px;
        }

        .menu-label {
            color: #8192ad;
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 1.5px;
            padding: 0 12px;
            margin: 20px 0 10px;
        }

        .menu-label:first-child {
            margin-top: 0;
        }

        .sidebar-menu {
            list-style: none;
        }

        .sidebar-menu li {
            margin-bottom: 5px;
        }

        .sidebar-menu a {
            display: flex;
            align-items: center;
            gap: 12px;
            color: #c2cee0;
            padding: 12px;
            border-radius: 8px;
            font-size: 13px;
            transition: 0.2s;
        }

        .sidebar-menu a:hover,
        .sidebar-menu a.active {
            background: #2457e6;
            color: white;
        }

        .menu-icon {
            width: 20px;
            text-align: center;
            font-size: 16px;
        }

        /* MAIN CONTENT */

        .main-wrapper {
            margin-left: 255px;
            width: calc(100% - 255px);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .main-content {
            padding: 30px;
            flex: 1;
        }

        /* NAVBAR */

        .top-navbar {
            height: 75px;
            background: white;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 30px;
            position: sticky;
            top: 0;
            z-index: 900;
        }

        .navbar-left,
        .navbar-right {
            display: flex;
            align-items: center;
            gap: 18px;
        }

        .navbar-heading {
            font-size: 17px;
            font-weight: 700;
        }

        .navbar-subtitle {
            font-size: 11px;
            color: var(--muted);
            margin-top: 4px;
        }

        .menu-toggle {
            display: none;
            border: none;
            background: transparent;
            font-size: 24px;
            cursor: pointer;
            color: var(--text);
        }

        .notification-link {
            width: 38px;
            height: 38px;
            border-radius: 10px;
            background: #f1f5f9;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text);
            font-size: 17px;
            position: relative;
        }

        .notification-dot {
            width: 7px;
            height: 7px;
            background: #ef4444;
            border-radius: 50%;
            position: absolute;
            top: 8px;
            right: 8px;
        }

        .profile {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .profile-avatar {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: #dbeafe;
            color: #1d4ed8;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
        }

        .profile-name {
            font-size: 12px;
            font-weight: 700;
        }

        .profile-role {
            color: var(--muted);
            font-size: 10px;
            margin-top: 3px;
        }

        /* PAGE HEADINGS */

        .page-heading {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
            margin-bottom: 25px;
        }

        .page-heading h1 {
            font-size: 25px;
            margin-bottom: 7px;
        }

        .page-heading p {
            font-size: 13px;
            color: var(--muted);
        }

        /* BUTTONS */

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 7px;
            padding: 11px 17px;
            border-radius: 8px;
            border: none;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
        }

        .btn-primary:hover {
            background: var(--primary-dark);
        }

        .btn-light {
            background: white;
            color: var(--text);
            border: 1px solid var(--border);
        }

        /* CARDS */

        .card {
            background: white;
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 22px;
            box-shadow: 0 3px 12px rgba(15,23,42,0.025);
        }

        /* FOOTER */

        .footer {
            padding: 18px 30px;
            border-top: 1px solid var(--border);
            background: white;
            color: var(--muted);
            font-size: 11px;
            display: flex;
            justify-content: space-between;
            gap: 10px;
        }

        /* RESPONSIVE */

        .sidebar-overlay {
            display: none;
        }

        @media (max-width: 900px) {
            .sidebar {
                transform: translateX(-100%);
            }

            .sidebar.open {
                transform: translateX(0);
            }

            .main-wrapper {
                margin-left: 0;
                width: 100%;
            }

            .menu-toggle {
                display: block;
            }

            .sidebar-overlay.show {
                display: block;
                position: fixed;
                inset: 0;
                background: rgba(0,0,0,0.4);
                z-index: 999;
            }
        }

        @media (max-width: 600px) {
            .main-content {
                padding: 18px;
            }

            .top-navbar {
                padding: 0 18px;
            }

            .profile-details {
                display: none;
            }

            .footer {
                padding: 15px 18px;
                flex-direction: column;
            }

            .page-heading {
                align-items: flex-start;
                flex-direction: column;
            }
        }
    </style>

    {% block extra_css %}{% endblock %}
</head>

<body>

<div class="app-layout">

    {% include 'sidebar.html' %}

    <div class="sidebar-overlay" id="sidebarOverlay"
         onclick="toggleSidebar()"></div>

    <div class="main-wrapper">

        {% include 'navbar.html' %}

        <main class="main-content">
            {% block content %}
            {% endblock %}
        </main>

        {% include 'footer.html' %}

    </div>
</div>

<script>
    function toggleSidebar() {
        const sidebar = document.getElementById('mainSidebar');
        const overlay = document.getElementById('sidebarOverlay');

        sidebar.classList.toggle('open');
        overlay.classList.toggle('show');
    }
</script>

{% block extra_js %}{% endblock %}

</body>
</html>

{% extends 'base.html' %}

{% block content %}

<div class="container mt-4">

    <h2>Add New Driver</h2>

    {% if messages %}
        {% for message in messages %}
            <div class="alert alert-danger">
                {{ message }}
            </div>
        {% endfor %}
    {% endif %}

    <div class="card mt-3">
        <div class="card-body">

            <form method="POST">
                {% csrf_token %}

                <div class="row">

                    <div class="col-md-6 mb-3">
                        <label>Employee ID</label>
                        <input type="text" name="employee_id"
                               class="form-control" required>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label>First Name</label>
                        <input type="text" name="first_name"
                               class="form-control" required>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label>Last Name</label>
                        <input type="text" name="last_name"
                               class="form-control" required>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label>Email</label>
                        <input type="email" name="email"
                               class="form-control" required>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label>Phone</label>
                        <input type="text" name="phone"
                               class="form-control" required>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label>Licence Number</label>
                        <input type="text" name="license_number"
                               class="form-control" required>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label>Licence Type</label>
                        <select name="license_type" class="form-select" required>
                            <option value="">Select Licence Type</option>
                            <option value="LMV">Light Motor Vehicle</option>
                            <option value="HMV">Heavy Motor Vehicle</option>
                            <option value="HGMV">Heavy Goods Motor Vehicle</option>
                            <option value="HPMV">Heavy Passenger Motor Vehicle</option>
                            <option value="MCWG">Motorcycle With Gear</option>
                            <option value="OTHER">Other</option>
                        </select>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label>Licence Expiry</label>
                        <input type="date" name="license_expiry"
                               class="form-control" required>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label>Date of Joining</label>
                        <input type="date" name="date_of_joining"
                               class="form-control" required>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label>Status</label>
                        <select name="status" class="form-select">
                            <option value="available">Available</option>
                            <option value="on_trip">On Trip</option>
                            <option value="on_leave">On Leave</option>
                            <option value="inactive">Inactive</option>
                        </select>
                    </div>

                    <div class="col-md-12 mb-3">
                        <label>Address</label>
                        <textarea name="address" class="form-control"
                                  rows="3" required></textarea>
                    </div>

                </div>

                <button type="submit" class="btn btn-primary">
                    Save Driver
                </button>

                <a href="{% url 'driver_list' %}" class="btn btn-secondary">
                    Cancel
                </a>

            </form>

        </div>
    </div>

</div>

{% endblock %}

{% extends 'base.html' %}

{% block content %}

<div class="container mt-5">

    <div class="card">

        <div class="card-body">

            <h3>Delete Driver</h3>

            <p>
                Are you sure you want to delete
                <strong>
                    {{ driver.first_name }} {{ driver.last_name }}
                </strong>?
            </p>

            <form method="POST">
                {% csrf_token %}

                <button type="submit" class="btn btn-danger">
                    Yes, Delete
                </button>

                <a href="{% url 'driver_list' %}"
                   class="btn btn-secondary">
                    Cancel
                </a>

            </form>

        </div>

    </div>

</div>

{% endblock %}

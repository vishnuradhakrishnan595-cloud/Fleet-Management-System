
{% extends 'base.html' %}

{% block content %}

<div class="container py-4">

    <h2 class="mb-4">Update Vehicle</h2>

    {% if errors %}
        <div class="alert alert-danger">
            {% for field, messages_list in errors.items %}
                <p><strong>{{ field }}:</strong></p>
                {% for error in messages_list %}
                    <p>{{ error }}</p>
                {% endfor %}
            {% endfor %}
        </div>
    {% endif %}

    <div class="card shadow-sm">
        <div class="card-body">

            <form method="POST" enctype="multipart/form-data">
                {% csrf_token %}

                <div class="row g-3">

                    <div class="col-md-6">
                        <label class="form-label">Vehicle Number</label>
                        <input type="text" name="vehicle_number"
                               class="form-control" required
                               value="{{ vehicle.vehicle_number }}">
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">Vehicle Name</label>
                        <input type="text" name="vehicle_name"
                               class="form-control" required
                               value="{{ vehicle.vehicle_name }}">
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">Vehicle Type</label>
                        <select name="vehicle_type" class="form-select" required>
                            {% for value, label in vehicle.VEHICLE_TYPES %}
                                <option value="{{ value }}"
                                    {% if vehicle.vehicle_type == value %}selected{% endif %}>
                                    {{ label }}
                                </option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">Brand</label>
                        <input type="text" name="brand"
                               class="form-control" required
                               value="{{ vehicle.brand }}">
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">Model</label>
                        <input type="text" name="model"
                               class="form-control" required
                               value="{{ vehicle.model }}">
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">Year</label>
                        <input type="number" name="year"
                               class="form-control" required
                               value="{{ vehicle.year }}">
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">Fuel Type</label>
                        <select name="fuel_type" class="form-select" required>
                            {% for value, label in vehicle.FUEL_TYPES %}
                                <option value="{{ value }}"
                                    {% if vehicle.fuel_type == value %}selected{% endif %}>
                                    {{ label }}
                                </option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">Capacity (KG)</label>
                        <input type="number" name="capacity"
                               class="form-control" min="1" required
                               value="{{ vehicle.capacity }}">
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">Registration Date</label>
                        <input type="date" name="registration_date"
                               class="form-control" required
                               value="{{ vehicle.registration_date|date:'Y-m-d' }}">
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">Insurance Expiry</label>
                        <input type="date" name="insurance_expiry"
                               class="form-control" required
                               value="{{ vehicle.insurance_expiry|date:'Y-m-d' }}">
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">Status</label>
                        <select name="status" class="form-select">
                            {% for value, label in vehicle.STATUS_CHOICES %}
                                <option value="{{ value }}"
                                    {% if vehicle.status == value %}selected{% endif %}>
                                    {{ label }}
                                </option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">Change Vehicle Image</label>
                        <input type="file" name="image"
                               class="form-control" accept="image/*">
                        {% if vehicle.image %}
                            <img src="{{ vehicle.image.url }}"
                                 width="100" class="mt-2" alt="Current vehicle">
                        {% endif %}
                    </div>

                </div>

                <div class="mt-4">
                    <button type="submit" class="btn btn-primary">
                        Update Vehicle
                    </button>

                    <a href="{% url 'vehicle_list' %}"
                       class="btn btn-secondary">Cancel</a>
                </div>

            </form>

        </div>
    </div>

</div>

{% endblock %}

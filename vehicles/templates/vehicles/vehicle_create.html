
{% extends 'base.html' %}

{% block content %}

<div class="container py-4">

    <h2 class="mb-4">Register New Vehicle</h2>

    {% if errors %}
        <div class="alert alert-danger">
            {% for field, messages_list in errors.items %}
                <p><strong>{{ field }}:</strong></p>
                {% for error in messages_list %}
                    <p>{{ error }}</p>
                {% endfor %}
            {% endfor %}
        </div>
    {% endif %}

    <div class="card shadow-sm">
        <div class="card-body">

            <form method="POST" enctype="multipart/form-data">
                {% csrf_token %}

                <div class="row g-3">

                    <div class="col-md-6">
                        <label class="form-label">Vehicle Number</label>
                        <input type="text" name="vehicle_number"
                               class="form-control" required
                               value="{{ data.vehicle_number|default:'' }}">
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">Vehicle Name</label>
                        <input type="text" name="vehicle_name"
                               class="form-control" required
                               value="{{ data.vehicle_name|default:'' }}">
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">Vehicle Type</label>
                        <select name="vehicle_type" class="form-select" required>
                            <option value="">Select Type</option>
                            <option value="truck">Truck</option>
                            <option value="van">Van</option>
                            <option value="bus">Bus</option>
                            <option value="car">Car</option>
                            <option value="pickup">Pickup</option>
                            <option value="trailer">Trailer</option>
                            <option value="other">Other</option>
                        </select>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">Brand</label>
                        <input type="text" name="brand"
                               class="form-control" required
                               value="{{ data.brand|default:'' }}">
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">Model</label>
                        <input type="text" name="model"
                               class="form-control" required
                               value="{{ data.model|default:'' }}">
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">Manufacturing Year</label>
                        <input type="number" name="year"
                               class="form-control" min="1900" max="2100"
                               required value="{{ data.year|default:'' }}">
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">Fuel Type</label>
                        <select name="fuel_type" class="form-select" required>
                            <option value="">Select Fuel</option>
                            <option value="petrol">Petrol</option>
                            <option value="diesel">Diesel</option>
                            <option value="electric">Electric</option>
                            <option value="hybrid">Hybrid</option>
                            <option value="cng">CNG</option>
                        </select>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">Capacity (KG)</label>
                        <input type="number" name="capacity"
                               class="form-control" min="1"
                               required value="{{ data.capacity|default:'' }}">
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">Registration Date</label>
                        <input type="date" name="registration_date"
                               class="form-control" required
                               value="{{ data.registration_date|default:'' }}">
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">Insurance Expiry</label>
                        <input type="date" name="insurance_expiry"
                               class="form-control" required
                               value="{{ data.insurance_expiry|default:'' }}">
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">Status</label>
                        <select name="status" class="form-select">
                            <option value="available">Available</option>
                            <option value="in_use">In Use</option>
                            <option value="maintenance">Under Maintenance</option>
                            <option value="inactive">Inactive</option>
                        </select>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">Vehicle Image</label>
                        <input type="file" name="image"
                               class="form-control" accept="image/*">
                    </div>

                </div>

                <div class="mt-4">
                    <button type="submit" class="btn btn-success">
                        Save Vehicle
                    </button>

                    <a href="{% url 'vehicle_list' %}"
                       class="btn btn-secondary">Cancel</a>
                </div>

            </form>

        </div>
    </div>

</div>

{% endblock %}
